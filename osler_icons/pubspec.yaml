name: osler_icons
description: "Osler icons is from Strange icons Osler icon pack with over 500 regular icons in solid and monotone styles."
version: 0.0.1
homepage: https://github.com/CoderNamedHendrick/strange_icons/tree/main/osler_icons
repository: https://github.com/CoderNamedHendrick/strange_icons/tree/main/osler_icons
topics:
  - icon-packs
  - icons
  - osler-icons
  - strange-icons

screenshots:
  - description: 'rendered icons example'
    path: ss/img.png

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter:

  fonts:
    - family: osler_solid
      fonts:
        - asset: fonts/osler_solid.ttf

    - family: osler_monotone
      fonts:
        - asset: fonts/osler_monotone.ttf