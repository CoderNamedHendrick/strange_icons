name: freud_icons
description: "Freud icon is from strange icons freud icon pack with close to 500 regular icons in solid and monotone styles."
version: 0.0.2
homepage: https://github.com/CoderNamedHendrick/strange_icons/tree/main/freud_icons
repository: https://github.com/CoderNamedHendrick/strange_icons/tree/main/freud_icons
topics:
  - icon-packs
  - icons
  - freud-icons
  - strange-icons

screenshots:
  - description: 'rendered icons example'
    path: ss/img.png

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter:
  fonts:
    - family: freud_solid
      fonts:
        - asset: fonts/freud_solid.ttf

    - family: freud_monotone
      fonts:
        - asset: fonts/freud_monotone.ttf