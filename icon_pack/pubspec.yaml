name: strange_icons
description: "Strange Icons pack with 6 icons sets containing over 3000 icons in monotone and solid styles."
version: 0.0.2
homepage: https://github.com/CoderNamedHendrick/strange_icons/tree/main/icon_pack
repository: https://github.com/CoderNamedHendrick/strange_icons/tree/main/icon_pack

topics:
  - strange-icons
  - icon-packs
  - icons

screenshots:
  - description: 'rendered icons example'
    path: ss/img.png

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=1.17.0"

define: &packs_version 0.0.2

dependencies:
  flutter:
    sdk: flutter

  asklepios_icons: *packs_version
  freud_icons: *packs_version
  nightingale_icons: *packs_version
  osler_icons: *packs_version
  sandow_icons: *packs_version
  turing_icons: 0.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0