name: turing_icons
description: "Turing icons is from Strange icons Turing icon pack with over 600 regular icons in solid and monotone styles."
version: 0.0.2
homepage: https://github.com/CoderNamedHendrick/strange_icons/tree/main/turing_icons
repository: https://github.com/CoderNamedHendrick/strange_icons/tree/main/turing_icons
topics:
  - icon-packs
  - icons
  - turing-icons
  - strange-icons

screenshots:
  - description: 'rendered icons example'
    path: ss/img.png

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:

  fonts:
    - family: turing_solid
      fonts:
        - asset: fonts/turing_solid.ttf

    - family: turing_monotone
      fonts:
        - asset: fonts/turing_monotone.ttf